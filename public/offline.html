<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="theme-color" content="#10b981" />
    <title>Breeva — Offline</title>
    <style>
      body { font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif; margin: 0; min-height: 100vh; display: grid; place-items: center; background: #f8fafc; color: #0f172a; }
      .card { background: #fff; border-radius: 16px; padding: 24px; max-width: 360px; width: calc(100% - 40px); box-shadow: 0 8px 30px rgba(0,0,0,.08); text-align: center; }
      .dot { width: 48px; height: 48px; border-radius: 999px; margin: 0 auto 12px; background: #10b981; color: #fff; display: grid; place-items: center; font-weight: 700; }
      h1 { font-size: 18px; margin: 0 0 6px; }
      p { margin: 0; font-size: 14px; color: #475569; }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="dot">B</div>
      <h1>Kamu sedang offline</h1>
      <p>Breeva tetap bisa dipakai untuk fitur yang sudah tersimpan. Data akan sinkron otomatis saat online.</p>
    </div>
  </body>
</html>
