AWSTemplateFormatVersion: '2010-09-09'
Description: >-
  Breeva traffic-camera trial (task N-33), base stack in AWS Jakarta (ap-southeast-3): the private bucket for the camera
  list and the counts, the container repository of the counting function, and the CodeBuild project that builds its
  image inside AWS (the model is fetched from the YOLOX release there, so nothing large is uploaded from a home line). Contest trial only; the counting stack
  breeva-cctv stops on 6 Dec 2026. Everything is named breeva-* and tagged project=breeva.

Resources:
  Bucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub 'breeva-cctv-${AWS::AccountId}'
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault: { SSEAlgorithm: AES256 }
      OwnershipControls:
        Rules: [{ ObjectOwnership: BucketOwnerEnforced }]
      LifecycleConfiguration:
        Rules:
          - Id: hitung-30-hari
            Status: Enabled
            Prefix: hitung/
            ExpirationInDays: 30
      Tags:
        - { Key: project, Value: breeva }

  Repo:
    Type: AWS::ECR::Repository
    Properties:
      RepositoryName: breeva-cctv
      ImageScanningConfiguration: { ScanOnPush: false }
      LifecyclePolicy:
        LifecyclePolicyText: >-
          {"rules":[{"rulePriority":1,"description":"keep the last 3 images","selection":{"tagStatus":"any",
          "countType":"imageCountMoreThan","countNumber":3},"action":{"type":"expire"}}]}
      Tags:
        - { Key: project, Value: breeva }

  BuildLogs:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: /aws/codebuild/breeva-cctv-build
      RetentionInDays: 14
      Tags:
        - { Key: project, Value: breeva }

  BuildRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: breeva-cctv-build
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: { Service: codebuild.amazonaws.com }
            Action: sts:AssumeRole
      Policies:
        - PolicyName: breeva-cctv-build
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: [logs:CreateLogStream, logs:PutLogEvents]
                Resource: !Sub '${BuildLogs.Arn}:*'
              - Effect: Allow
                Action: [s3:GetObject, s3:GetObjectVersion]
                Resource: !Sub '${Bucket.Arn}/build/*'
              - Effect: Allow
                Action: ecr:GetAuthorizationToken
                Resource: '*'
              - Effect: Allow
                Action: [ecr:BatchCheckLayerAvailability, ecr:InitiateLayerUpload, ecr:UploadLayerPart, ecr:CompleteLayerUpload,
                         ecr:PutImage, ecr:BatchGetImage, ecr:GetDownloadUrlForLayer]
                Resource: !GetAtt Repo.Arn
      Tags:
        - { Key: project, Value: breeva }

  Build:
    Type: AWS::CodeBuild::Project
    Properties:
      Name: breeva-cctv-build
      ServiceRole: !GetAtt BuildRole.Arn
      Artifacts: { Type: NO_ARTIFACTS }
      Source:
        Type: S3
        Location: !Sub '${Bucket}/build/source.zip'
        BuildSpec: buildspec.yml
      Environment:
        Type: LINUX_CONTAINER
        ComputeType: BUILD_GENERAL1_SMALL
        Image: aws/codebuild/amazonlinux-x86_64-standard:5.0
        PrivilegedMode: true
        EnvironmentVariables:
          - { Name: REPO_URI, Value: !GetAtt Repo.RepositoryUri }
      TimeoutInMinutes: 30
      LogsConfig:
        CloudWatchLogs: { Status: ENABLED, GroupName: !Ref BuildLogs }
      Tags:
        - { Key: project, Value: breeva }

Outputs:
  BucketName:
    Value: !Ref Bucket
  RepoUri:
    Value: !GetAtt Repo.RepositoryUri
